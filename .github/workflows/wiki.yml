# Publishes docs/wiki/*.md to the repository's GitHub wiki.
#
# The wiki git repository only exists after its first page has been created,
# so create any page once from the Wiki tab before the first run.
name: Publish wiki

on:
  push:
    branches: [main]
    paths:
      - "docs/wiki/**"
      - ".github/workflows/wiki.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wiki
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clone the wiki
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" wiki || {
            echo "::error::The wiki repository does not exist yet. Open the Wiki tab, create the first page, then re-run this workflow."
            exit 1
          }

      - name: Copy the pages
        run: |
          rsync -a --delete --exclude ".git" docs/wiki/ wiki/

      - name: Commit and push
        working-directory: wiki
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Wiki already up to date."
            exit 0
          fi
          git commit -m "Update wiki from ${GITHUB_SHA::7}"
          git push
